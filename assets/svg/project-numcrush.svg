<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="numcrush-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21152B" />
      <stop offset="50%" stop-color="#2D1A38" />
      <stop offset="100%" stop-color="#190F21" />
    </linearGradient>
    <linearGradient id="tile-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EB5" />
      <stop offset="100%" stop-color="#E85D75" />
    </linearGradient>
    <linearGradient id="tile-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B28DFF" />
      <stop offset="100%" stop-color="#6C4AB6" />
    </linearGradient>
    <linearGradient id="tile-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF385" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>
    <linearGradient id="tile-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF" />
      <stop offset="100%" stop-color="#00A8B5" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" rx="12" fill="url(#numcrush-bg)" />

  <!-- Window Header Bar (Browser/Game Frame) -->
  <rect width="600" height="42" fill="#170E1E" rx="12" />
  <rect y="30" width="600" height="12" fill="#170E1E" />
  <circle cx="24" cy="21" r="5" fill="#E85D75" />
  <circle cx="42" cy="21" r="5" fill="#FFF385" />
  <circle cx="60" cy="21" r="5" fill="#7DF9FF" />

  <!-- URL Pill -->
  <rect x="170" y="10" width="260" height="22" rx="11" fill="rgba(255,255,255,0.08)" />
  <text x="300" y="25" fill="#FFC5C1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle" font-weight="500">numberbraker.vercel.app</text>

  <!-- Game Header Dashboard -->
  <g transform="translate(40, 60)">
    <!-- Game Title -->
    <text x="0" y="26" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold">NUM<tspan fill="#FF9EB5">CRUSH</tspan></text>
    <text x="142" y="26" fill="#D1A8B9" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">| Destruidor de Números</text>

    <!-- Score Counter -->
    <rect x="330" y="2" width="105" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,158,181,0.3)" />
    <text x="382" y="23" fill="#FFF385" font-family="'Silkscreen', monospace" font-size="13" font-weight="bold" text-anchor="middle">★ 24,850</text>

    <!-- Coin Counter -->
    <rect x="445" y="2" width="85" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,243,133,0.3)" />
    <text x="487" y="22" fill="#FFE8ED" font-family="'Silkscreen', monospace" font-size="12" text-anchor="middle">🪙 420</text>
  </g>

  <!-- Left: Arcade Game Grid -->
  <g transform="translate(40, 110)">
    <rect width="250" height="220" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" />

    <!-- Row 1 -->
    <rect x="18" y="18" width="46" height="46" rx="8" fill="url(#tile-pink)" />
    <text x="41" y="47" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">7</text>

    <rect x="72" y="18" width="46" height="46" rx="8" fill="url(#tile-purple)" />
    <text x="95" y="47" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">3</text>

    <rect x="126" y="18" width="46" height="46" rx="8" fill="url(#tile-yellow)" />
    <text x="149" y="47" fill="#2A1E1E" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">9</text>

    <rect x="180" y="18" width="46" height="46" rx="8" fill="url(#tile-cyan)" />
    <text x="203" y="47" fill="#2A1E1E" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">2</text>

    <!-- Row 2 -->
    <rect x="18" y="70" width="46" height="46" rx="8" fill="url(#tile-purple)" />
    <text x="41" y="99" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">4</text>

    <!-- Combo Tile with Glow Outline -->
    <rect x="72" y="70" width="46" height="46" rx="8" fill="url(#tile-pink)" stroke="#FFF" stroke-width="2" />
    <text x="95" y="99" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">7</text>

    <rect x="126" y="70" width="46" height="46" rx="8" fill="url(#tile-pink)" stroke="#FFF" stroke-width="2" />
    <text x="149" y="99" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">7</text>

    <rect x="180" y="70" width="46" height="46" rx="8" fill="url(#tile-yellow)" />
    <text x="203" y="99" fill="#2A1E1E" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">5</text>

    <!-- Row 3 -->
    <rect x="18" y="122" width="46" height="46" rx="8" fill="url(#tile-cyan)" />
    <text x="41" y="151" fill="#2A1E1E" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">1</text>

    <rect x="72" y="122" width="46" height="46" rx="8" fill="url(#tile-yellow)" />
    <text x="95" y="151" fill="#2A1E1E" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">8</text>

    <rect x="126" y="122" width="46" height="46" rx="8" fill="url(#tile-purple)" />
    <text x="149" y="151" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">6</text>

    <rect x="180" y="122" width="46" height="46" rx="8" fill="url(#tile-pink)" />
    <text x="203" y="151" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">3</text>

    <!-- Bottom Status Text inside Board -->
    <text x="125" y="195" fill="#FF9EB5" font-family="'Silkscreen', monospace" font-size="11" text-anchor="middle">💥 COMBO x3! +300 PTS</text>
  </g>

  <!-- Right: Game Modules (Fases, Ranking, Loja) -->
  <g transform="translate(310, 110)">
    <!-- Card 1: Fases & Progresso -->
    <rect width="250" height="66" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="20" y="28" fill="#FFF385" font-family="'Silkscreen', monospace" font-size="11" font-weight="bold">FASE 14: FLORESTA NUMÉRICA</text>
    <rect x="20" y="38" width="150" height="10" rx="5" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="38" width="110" height="10" rx="5" fill="url(#tile-pink)" />
    <text x="180" y="47" fill="#D1A8B9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">75% Concluído</text>

    <!-- Card 2: Ranking Global & Conquistas -->
    <g transform="translate(0, 78)">
      <rect width="118" height="64" rx="10" fill="rgba(108,74,182,0.22)" stroke="rgba(178,141,255,0.3)" />
      <text x="16" y="24" fill="#B28DFF" font-family="'Silkscreen', monospace" font-size="10">🏆 RANKING</text>
      <text x="16" y="48" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">#4 Lugar</text>
    </g>

    <!-- Card 3: Loja de Itens & Moedas -->
    <g transform="translate(132, 78)">
      <rect width="118" height="64" rx="10" fill="rgba(255,158,181,0.18)" stroke="rgba(255,158,181,0.35)" />
      <text x="16" y="24" fill="#FF9EB5" font-family="'Silkscreen', monospace" font-size="10">🛒 LOJA</text>
      <text x="16" y="48" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Poderes &amp; Skins</text>
    </g>

    <!-- Bottom Feature Badges -->
    <g transform="translate(0, 154)">
      <rect width="250" height="66" rx="10" fill="rgba(0,168,181,0.15)" stroke="rgba(125,249,255,0.25)" />
      <text x="18" y="26" fill="#7DF9FF" font-family="'Silkscreen', monospace" font-size="10">🎖️ CONQUISTAS DESBLOQUEADAS</text>
      <text x="18" y="48" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Destruidor Mestre • 100k Club</text>
    </g>
  </g>
</svg>
