<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Pixel art Pink Ladybug (32x32) -->
  <!-- Antennae tips -->
  <rect x="7" y="2" width="2" height="2" fill="#2A1E1E"/>
  <rect x="23" y="2" width="2" height="2" fill="#2A1E1E"/>
  <rect x="9" y="4" width="2" height="2" fill="#2A1E1E"/>
  <rect x="21" y="4" width="2" height="2" fill="#2A1E1E"/>
  <rect x="11" y="6" width="2" height="2" fill="#2A1E1E"/>
  <rect x="19" y="6" width="2" height="2" fill="#2A1E1E"/>

  <!-- Head -->
  <rect x="12" y="7" width="8" height="5" fill="#2A1E1E"/>
  <rect x="13" y="6" width="6" height="2" fill="#2A1E1E"/>
  <!-- Head eyes / blush -->
  <rect x="13" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect x="17" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect x="14" y="9" width="1" height="1" fill="#2A1E1E"/>
  <rect x="18" y="9" width="1" height="1" fill="#2A1E1E"/>

  <!-- Body outline -->
  <rect x="7" y="12" width="18" height="15" fill="#2A1E1E"/>
  <rect x="9" y="10" width="14" height="19" fill="#2A1E1E"/>
  <rect x="11" y="9" width="10" height="21" fill="#2A1E1E"/>

  <!-- Wings - Left Wing (Pink #F99FA9 / #FFC5C1 highlight) -->
  <rect x="8" y="13" width="7" height="13" fill="#F99FA9"/>
  <rect x="10" y="11" width="5" height="17" fill="#F99FA9"/>
  <rect x="9" y="12" width="3" height="4" fill="#FFC5C1"/>
  <rect x="9" y="13" width="2" height="2" fill="#FFFFFF"/>

  <!-- Wings - Right Wing (Pink #F99FA9 / #FFC5C1 highlight) -->
  <rect x="17" y="13" width="7" height="13" fill="#F99FA9"/>
  <rect x="17" y="11" width="5" height="17" fill="#F99FA9"/>
  <rect x="20" y="12" width="3" height="4" fill="#FFC5C1"/>
  <rect x="21" y="13" width="2" height="2" fill="#FFFFFF"/>

  <!-- Center Wing Division (dark purple/brown #503850) -->
  <rect x="15" y="11" width="2" height="18" fill="#503850"/>

  <!-- Spots (Marrom escuro #2A1E1E / Roxo fechado #503850) -->
  <!-- Left wing spots -->
  <rect x="10" y="15" width="3" height="3" fill="#2A1E1E"/>
  <rect x="9" y="21" width="3" height="3" fill="#2A1E1E"/>
  <rect x="13" y="23" width="2" height="2" fill="#2A1E1E"/>

  <!-- Right wing spots -->
  <rect x="19" y="15" width="3" height="3" fill="#2A1E1E"/>
  <rect x="20" y="21" width="3" height="3" fill="#2A1E1E"/>
  <rect x="17" y="23" width="2" height="2" fill="#2A1E1E"/>

  <!-- Little legs peeking out -->
  <rect x="5" y="14" width="2" height="2" fill="#2A1E1E"/>
  <rect x="4" y="15" width="2" height="2" fill="#2A1E1E"/>
  <rect x="25" y="14" width="2" height="2" fill="#2A1E1E"/>
  <rect x="26" y="15" width="2" height="2" fill="#2A1E1E"/>

  <rect x="5" y="20" width="2" height="2" fill="#2A1E1E"/>
  <rect x="4" y="21" width="2" height="2" fill="#2A1E1E"/>
  <rect x="25" y="20" width="2" height="2" fill="#2A1E1E"/>
  <rect x="26" y="21" width="2" height="2" fill="#2A1E1E"/>

  <rect x="6" y="26" width="2" height="2" fill="#2A1E1E"/>
  <rect x="5" y="27" width="2" height="2" fill="#2A1E1E"/>
  <rect x="24" y="26" width="2" height="2" fill="#2A1E1E"/>
  <rect x="25" y="27" width="2" height="2" fill="#2A1E1E"/>
</svg>
