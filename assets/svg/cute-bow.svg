    <path d="M68 64 C74 74 81 86 80 88 C78 89 71 73 66 66 Z" fill="#AA6581" opacity="0.4"/>

    <!-- Center Knot -->
    <rect x="54" y="42" width="12" height="14" rx="4" fill="#FFFFFF"/>
    <rect x="55" y="43" width="10" height="12" rx="3" fill="#AA6581"/>
    <ellipse cx="60" cy="49" rx="3.5" ry="4" fill="#F99FA9"/>
  </g>
</svg>
