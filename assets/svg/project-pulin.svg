<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="pulin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B28" />
      <stop offset="50%" stop-color="#3D2436" />
      <stop offset="100%" stop-color="#1F121C" />
    </linearGradient>
    <linearGradient id="pulin-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F99FA9" />
      <stop offset="100%" stop-color="#AA6581" />
    </linearGradient>
    <linearGradient id="gold-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="pulin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" rx="12" fill="url(#pulin-bg)" />

  <!-- Window Header Bar (Browser/App Mockup) -->
  <rect width="600" height="42" fill="#20131E" rx="12" />
  <rect y="30" width="600" height="12" fill="#20131E" />
  <circle cx="24" cy="21" r="5" fill="#F99FA9" />
  <circle cx="42" cy="21" r="5" fill="#FFC5C1" />
  <circle cx="60" cy="21" r="5" fill="#AA6581" />

  <!-- URL Pill -->
  <rect x="180" y="10" width="240" height="22" rx="11" fill="rgba(255,255,255,0.08)" />
  <text x="300" y="25" fill="#FFC5C1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle" font-weight="500">pulin-five.vercel.app</text>

  <!-- Hero Content Grid -->
  <!-- App Logo & Title -->
  <g transform="translate(40, 68)">
    <rect width="40" height="40" rx="10" fill="url(#pulin-accent)" />
    <text x="20" y="27" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="20" font-weight="bold" text-anchor="middle">P</text>
    <text x="52" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">pulin</text>
    <text x="114" y="26" fill="#F99FA9" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">.gamified signup</text>
  </g>

  <!-- Coin Balance Badge -->
  <g transform="translate(430, 68)">
    <rect width="130" height="38" rx="19" fill="rgba(255,197,193,0.12)" stroke="rgba(249,159,169,0.3)" />
    <circle cx="22" cy="19" r="11" fill="url(#gold-coin)" />
    <text x="22" y="23" fill="#2A1E1E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🪙</text>
    <text x="75" y="24" fill="#FFE8ED" font-family="'Silkscreen', monospace" font-size="13" font-weight="bold">+150 MOEDAS</text>
  </g>

  <!-- Progress Stepper Bar -->
  <g transform="translate(40, 132)">
    <rect width="520" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Step 1 Complete -->
    <circle cx="50" cy="32" r="15" fill="#AA6581" />
    <text x="50" y="37" fill="#FFFFFF" font-family="sans-serif" font-size="13" text-anchor="middle">✓</text>
    <text x="76" y="30" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Etapa 1</text>
    <text x="76" y="44" fill="#D1A8B9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Perfil Criado</text>

    <!-- Connector 1 -->
    <line x1="145" y1="32" x2="210" y2="32" stroke="#AA6581" stroke-width="3" stroke-dasharray="4 4" />

    <!-- Step 2 In Progress -->
    <circle cx="230" cy="32" r="16" fill="#F99FA9" stroke="#FFF" stroke-width="2" />
    <text x="230" y="37" fill="#2A1E1E" font-family="'Silkscreen', monospace" font-size="11" text-anchor="middle" font-weight="bold">2</text>
    <text x="256" y="30" fill="#FFC5C1" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Etapa 2</text>
    <text x="256" y="44" fill="#D1A8B9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Missões Ativas</text>

    <!-- Connector 2 -->
    <line x1="335" y1="32" x2="400" y2="32" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

    <!-- Step 3 Reward -->
    <circle cx="420" cy="32" r="15" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.25)" />
    <text x="420" y="37" fill="#D1A8B9" font-family="'Silkscreen', monospace" font-size="11" text-anchor="middle">3</text>
    <text x="446" y="30" fill="#FFE6EB" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Recompensa</text>
    <text x="446" y="44" fill="#D1A8B9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Avatar Exclusivo</text>
  </g>

  <!-- Interactive Reward Box Cards -->
  <!-- Left Box: Unlocked Perks -->
  <g transform="translate(40, 216)">
    <rect width="250" height="114" rx="12" fill="rgba(170,101,129,0.18)" stroke="rgba(249,159,169,0.3)" />
    <text x="20" y="32" fill="#FFC5C1" font-family="'Silkscreen', monospace" font-size="11" font-weight="bold">CONQUISTAS DO CADASTRO</text>
    <circle cx="34" cy="62" r="12" fill="rgba(255,255,255,0.1)" />
    <text x="34" y="66" fill="#FFF275" font-size="13" text-anchor="middle">✨</text>
    <text x="56" y="66" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">+50 XP de Boas-Vindas</text>

    <circle cx="34" cy="92" r="12" fill="rgba(255,255,255,0.1)" />
    <text x="34" y="96" fill="#F99FA9" font-size="13" text-anchor="middle">🎁</text>
    <text x="56" y="96" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Emblema de Pioneiro(a)</text>
  </g>

  <!-- Right Box: Exclusive Avatar Unlocked Preview -->
  <g transform="translate(310, 216)">
    <rect width="250" height="114" rx="12" fill="rgba(80,56,80,0.3)" stroke="rgba(249,159,169,0.4)" stroke-dasharray="4 4" />
    <!-- Avatar Preview Circle -->
    <circle cx="56" cy="57" r="32" fill="#AA6581" stroke="#FFC5C1" stroke-width="2" />
    <text x="56" y="64" font-size="28" text-anchor="middle">👑</text>

    <text x="104" y="44" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Avatar Exclusivo</text>
    <text x="104" y="62" fill="#FFC5C1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Desbloqueado ao concluir!</text>
    <rect x="104" y="74" width="110" height="24" rx="12" fill="url(#pulin-accent)" />
    <text x="159" y="90" fill="#FFFFFF" font-family="'Silkscreen', monospace" font-size="9" font-weight="bold" text-anchor="middle">DESBLOQUEAR</text>
  </g>
</svg>
